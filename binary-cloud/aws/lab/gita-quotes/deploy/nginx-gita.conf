# Linux: copy to /etc/nginx/sites-available/gita, link it into sites-enabled,
# remove the default site, then: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    server_name _;

    # UI: static files copied from static/
    root /var/www/gita;
    index index.html;

    # API: forwarded to gunicorn on localhost. No URI after the port,
    # so the /api prefix is passed through unchanged (Flask routes start with /api).
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
